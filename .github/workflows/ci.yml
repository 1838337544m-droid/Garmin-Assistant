name: Self-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python scripts/build_installer.py
      - run: python scripts/release_assets.py
      - name: Smoke-test isolated Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "from garmin_assistant import __version__; print(__version__)"
          $unpacked = Join-Path $env:RUNNER_TEMP 'Garmin installer files'
          Expand-Archive -LiteralPath "dist/Garmin-Assistant-$version-Windows-Installer.zip" -DestinationPath $unpacked
          $script = Join-Path $unpacked "Garmin-Assistant-$version/Install.ps1"
          & $script -SkipSetup -InstallRoot (Join-Path $env:RUNNER_TEMP 'Garmin install 中文') -PythonExecutable (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m pip check
