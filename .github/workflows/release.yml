name: Publish GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/check_release.py
      - name: Verify tag and package version match
        run: |
          python -c "import os; from garmin_assistant import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v'+__version__"
      - run: python -m build
      - run: python scripts/release_assets.py
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Garmin Assistant (API edition) | Garmin 助手（API）版本 $GITHUB_REF_NAME" --notes-file CHANGELOG.md
