[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-assistant-api"
version = "0.1.8"
description = "Garmin Assistant (API edition) | Garmin 助手（API）版本: local sync, running recovery guidance and extensible MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "1838337544m-droid"}]
dependencies = ["mcp>=1.30,<2", "garmin-connect-personal-api-python>=1.0,<2", "tzdata>=2025.2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
garmin-assistant = "garmin_assistant.cli:main"

[project.urls]
Repository = "https://github.com/1838337544m-droid/Garmin-Assistant"
Issues = "https://github.com/1838337544m-droid/Garmin-Assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
