[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-assistant-api"
version = "0.1.1"
description = "Garmin 助手（API）版本：本地同步、长跑恢复分析和可扩展 MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "1838337544m-droid"}]
dependencies = ["mcp>=1.30,<2", "garmin-connect-personal-api-python>=1.0,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
garmin-assistant = "garmin_assistant.cli:main"

[project.urls]
Repository = "https://github.com/1838337544m-droid/garmin-assistant-api"
Issues = "https://github.com/1838337544m-droid/garmin-assistant-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
